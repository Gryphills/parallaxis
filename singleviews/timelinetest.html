<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="../style.css">
		<script src="../timelinetest.js"></script>
		
		<!--link rel="preload" href="https://i.postimg.cc/3RCnNz5m/puppyrunsmlaa.png" as="image" /-->

		<title>Timeline Test</title>
		<meta name="title" content="Timeline Test" />
		<meta property="og:image" content="https://i.postimg.cc/YrJ2Sm2t/parallax-bg-parathumb.png">
		<meta property="og:url" content="https://gryphills.github.io/parallaxis/singleviews/oasis" />
		
		<meta property="twitter:url" content="https://gryphills.github.io/parallaxis/singleviews/oasis" />
		<meta property="twitter:title" content="Timeline Test" />
		<meta property="twitter:image" content="https://i.postimg.cc/YrJ2Sm2t/parallax-bg-parathumb.png" />
		<meta property="og:image:width" content="3200">
		<meta property="og:image:height" content="980">
		<meta property="twitter:card" content="summary_large_image" />

		<style>
			.timelineframe {
				background-color:#e4bff3;
				width:15px;
				height:20px;
				border: 1px solid #302a47;
				margin:1px;
			}
		</style>
  </head>
  
	<body>
    <div class="bgscreen">
      <div class="galleryitem">
		  <h2 class="gallery-title">wheee</h2>
		  <br>
		  
		  <div class="animation-wrap">
        	<div class="animbox" style='aspect-ratio:16/9; max-height:70vh;'>
				<div  style="width: 100%; height: 100%;">
					<div style="height: 100%;" class="frameholder">
					</div>
					
				</div>
				<div class="loadingcover" style="display: none;">
					
				</div>
			</div>
			<div class="animcontrolsbox">
				<input type="button" value="p" alt="Play/Pause" class="playbutton" data-toggled="false">
				<input type="range" min="0" class="animslider" max="0">
			</div>
		  </div>
		  
		  <br>
		  <div id="timelinesquares"><div style="background-color:#e4bff3;width:15px;height:20px;border: 1px solid #302a47; margin:1px;"></div></div>
		  <br>
		  <input accept="image/png, image/jpeg" id="uploadbutton" type="file" style="width:60px;height:30px;" multiple>
		  <br>
		  <div id="uploadedimgs"></div>
      </div>
    </div>
  </body>
</html>
